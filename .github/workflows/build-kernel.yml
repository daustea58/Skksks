name: Build Custom Kernel Surya (Multi-Source)

on:
  workflow_dispatch:
    inputs:
      base_kernel:
        description: 'Pilih Base Kernel Source'
        required: true
        type: choice
        options:
          - 'MiCode (MIUI Stock Android 10 - 4.14.117)'
          - 'LineageOS (Custom ROM Base - 4.14.x)'
          - 'ArrowOS (Performance Base - 4.14.x)'
      custom_defconfig:
        description: 'Manual Defconfig (Kosongkan untuk Auto-Detect)'
        required: false
        default: 'vendor/sdmsteppe-perf_defconfig'

env:
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    name: Build Kernel Surya
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Variable Berdasarkan Pilihan
        run: |
          if [ "${{ github.event.inputs.base_kernel }}" == "MiCode (MIUI Stock Android 10 - 4.14.117)" ]; then
            echo "KERNEL_REPO=https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=surya-q-oss" >> $GITHUB_ENV
            echo "ZIP_NAME=Surya-MiCode-4.14.117-KSU-Next" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.base_kernel }}" == "LineageOS (Custom ROM Base - 4.14.x)" ]; then
            echo "KERNEL_REPO=https://github.com/LineageOS/android_kernel_xiaomi_surya.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=lineage-18.1" >> $GITHUB_ENV
            echo "ZIP_NAME=Surya-LineageOS-4.14.x-KSU-Next" >> $GITHUB_ENV
          else
            echo "KERNEL_REPO=https://github.com/ArrowOS-Devices/android_kernel_xiaomi_surya.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=arrow-11.0" >> $GITHUB_ENV
            echo "ZIP_NAME=Surya-ArrowOS-4.14.x-KSU-Next" >> $GITHUB_ENV
          fi

      - name: Set up Build Environment (System Clang + GCC)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          bc bison flex libssl-dev make libc6-dev libncurses5-dev libncurses-dev curl \
          git zip unzip lld llvm python3 ccache wget zstd clang

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel-source

      - name: Integrasi KernelSU Next & SUSFS
        working-directory: kernel-source
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs
          cp -r ../susfs/kernel_patches/fs/* fs/
          cp -r ../susfs/kernel_patches/include/linux/* include/linux/
          echo "obj-y += susfs.o" >> fs/Makefile

      - name: Konfigurasi Kernel & Modul
        working-directory: kernel-source
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.custom_defconfig }}" ]; then
            TARGET_DEFCONFIG="${{ github.event.inputs.custom_defconfig }}"
          else
            DEFCONFIG_FULL_PATH=$(find arch/arm64/configs -name "*surya*defconfig" | head -n 1 || true)
            if [ -z "$DEFCONFIG_FULL_PATH" ]; then
              TARGET_DEFCONFIG="vendor/sdmsteppe-perf_defconfig"
            else
              TARGET_DEFCONFIG=${DEFCONFIG_FULL_PATH#arch/arm64/configs/}
            fi
          fi

          echo "✅ Menggunakan defconfig: $TARGET_DEFCONFIG"

          # Sisipkan HOSTCFLAGS="-fcommon" agar error yylloc tidak muncul
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" ${TARGET_DEFCONFIG}

          # Nonaktifkan Stackprotector karena Hybrid toolchain sering memicu error peringatan ini
          if grep -q "CONFIG_CC_STACKPROTECTOR_STRONG=y" out/.config 2>/dev/null; then
            ./scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG
          fi

          # Konfigurasi fitur custom
          ./scripts/config --file out/.config \
            -e CONFIG_MODULES \
            -e CONFIG_MODULE_FORCE_LOAD \
            -e CONFIG_MODULE_UNLOAD \
            -e CONFIG_MODULE_FORCE_UNLOAD \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_ALL \
            -e CONFIG_RANDOMIZE_BASE

          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" olddefconfig

      - name: Compile Kernel
        working-directory: kernel-source
        run: |
          set -euo pipefail
          
          # Target build Image.gz-dtb
          make -j$(nproc) O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" Image.gz-dtb || exit 1

      - name: Clone AnyKernel3 & Create ZIP
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} AnyKernel3
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/ || true
          cd AnyKernel3
          
          sed -i "s/kernel.string=.*/kernel.string=${{ env.ZIP_NAME }} by GitHub Actions/g" anykernel.sh
          sed -i 's/device.name1=.*/device.name1=surya/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=karna/g' anykernel.sh
          
          zip -r9 ../${{ env.ZIP_NAME }}.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 7
