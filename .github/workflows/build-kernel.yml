name: Build Custom Kernel Surya (Final Fix)

on:
  workflow_dispatch:
    inputs:
      base_kernel:
        description: 'Pilih Base Kernel'
        required: true
        type: choice
        options:
          - 'MiCode (MIUI Stock Android 10)'
          - 'LineageOS (Custom ROM Base)'
          - 'ArrowOS (Performance Base)'

env:
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Variable
        run: |
          if [ "${{ github.event.inputs.base_kernel }}" == "MiCode (MIUI Stock Android 10)" ]; then
            echo "KERNEL_REPO=https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=surya-q-oss" >> $GITHUB_ENV
            echo "ZIP_NAME=Surya-MiCode-KSU-Next" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.base_kernel }}" == "LineageOS (Custom ROM Base)" ]; then
            echo "KERNEL_REPO=https://github.com/LineageOS/android_kernel_xiaomi_surya.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=lineage-18.1" >> $GITHUB_ENV
            echo "ZIP_NAME=Surya-LineageOS-KSU-Next" >> $GITHUB_ENV
          else
            echo "KERNEL_REPO=https://github.com/ArrowOS-Devices/android_kernel_xiaomi_surya.git" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=arrow-11.0" >> $GITHUB_ENV
            echo "ZIP_NAME=Surya-ArrowOS-KSU-Next" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libncurses-dev \
          libssl-dev lld llvm make python2 python-is-python2 python3 zip zstd

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel-source

      - name: Setup KernelSU Next & SUSFS
        working-directory: kernel-source
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs
          cp -r ../susfs/kernel_patches/fs/* fs/
          cp -r ../susfs/kernel_patches/include/linux/* include/linux/
          echo "obj-y += susfs.o" >> fs/Makefile

      - name: Patch Python 2 gcc-wrapper
        working-directory: kernel-source
        run: |
          if [ -f scripts/gcc-wrapper.py ]; then
            # Paksa script menggunakan Python 2 secara eksplisit
            sed -i 's|#!/usr/bin/env python|#!/usr/bin/env python2|g' scripts/gcc-wrapper.py
            # Ubah sintaks print sebagai cadangan
            sed -i 's/print >> sys.stderr, line,/sys.stderr.write(line)/g' scripts/gcc-wrapper.py
          fi

      - name: Build Kernel
        working-directory: kernel-source
        run: |
          DEFCONFIG_FULL_PATH=$(find arch/arm64/configs -name "*surya*defconfig" | head -n 1 || true)
          if [ -z "$DEFCONFIG_FULL_PATH" ]; then
            TARGET_DEFCONFIG="vendor/sdmsteppe-perf_defconfig"
          else
            TARGET_DEFCONFIG=${DEFCONFIG_FULL_PATH#arch/arm64/configs/}
          fi
          echo "Menggunakan defconfig: $TARGET_DEFCONFIG"

          # Memaksa flag langsung masuk ke command line make
          MAKE_ARGS="O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1"
          
          make $MAKE_ARGS $TARGET_DEFCONFIG

          ./scripts/config --file out/.config \
            -e CONFIG_MODULES \
            -e CONFIG_MODULE_FORCE_LOAD \
            -e CONFIG_MODULE_UNLOAD \
            -e CONFIG_MODULE_FORCE_UNLOAD \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_MODULE_SIG_ALL \
            -e CONFIG_RANDOMIZE_BASE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG

          make $MAKE_ARGS olddefconfig
          make -j$(nproc) $MAKE_ARGS Image.gz-dtb || exit 1

      - name: Create Flashable ZIP
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} AnyKernel3
          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/ || true
          cd AnyKernel3
          sed -i "s/kernel.string=.*/kernel.string=${{ env.ZIP_NAME }} by Github Actions/g" anykernel.sh
          sed -i 's/device.name1=.*/device.name1=surya/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=karna/g' anykernel.sh
          zip -r9 ../${{ env.ZIP_NAME }}.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 7
